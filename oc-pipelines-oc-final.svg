<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Window Background -->
  <rect width="1280" height="800" fill="#151515"/>

  <!-- Red Hat OpenShift Masthead / Top Nav -->
  <rect width="1280" height="50" fill="#1b1d21"/>
  <rect x="0" y="49" width="1280" height="1" fill="#393f44"/>
  <!-- Logo -->
  <path d="M 24 15 L 42 15 L 46 25 L 42 35 L 24 35 L 20 25 Z" fill="#EE0000"/>
  <text x="56" y="32" fill="#FFFFFF" font-size="16" font-weight="700">Red Hat</text>
  <text x="122" y="32" fill="#FFFFFF" font-size="16" font-weight="300">OpenShift</text>
  <rect x="210" y="14" width="90" height="22" rx="3" fill="#2b2d30"/>
  <text x="220" y="29" fill="#0066CC" font-size="11" font-weight="600">Administrator</text>
  <!-- Search & User Header -->
  <text x="960" y="31" fill="#CCCCCC" font-size="13">Project: <tspan fill="#FFFFFF" font-weight="bold">sn-labs-rushiketh07</tspan></text>
  <circle cx="1235" cy="25" r="14" fill="#393f44"/>
  <text x="1229" y="30" fill="#FFFFFF" font-size="12" font-weight="600">R</text>

  <!-- Left Sidebar Navigation -->
  <rect x="0" y="50" width="240" height="750" fill="#1b1d21"/>
  <rect x="239" y="50" width="1" height="750" fill="#2b2d30"/>
  <text x="24" y="85" fill="#8A8D90" font-size="11" font-weight="700" letter-spacing="1">PERSPECTIVE</text>
  <text x="24" y="115" fill="#CCCCCC" font-size="14">Home</text>
  <text x="24" y="150" fill="#CCCCCC" font-size="14">Operators</text>
  <text x="24" y="185" fill="#CCCCCC" font-size="14">Workloads</text>
  
  <!-- Pipelines Section Active -->
  <rect x="0" y="200" width="240" height="70" fill="#2b2d30"/>
  <rect x="0" y="200" width="4" height="70" fill="#0066CC"/>
  <text x="24" y="222" fill="#FFFFFF" font-size="14" font-weight="600">Pipelines</text>
  <text x="36" y="244" fill="#FFFFFF" font-size="13" font-weight="600">• Pipelines</text>
  <text x="36" y="264" fill="#8A8D90" font-size="13">  PipelineRuns</text>

  <text x="24" y="300" fill="#CCCCCC" font-size="14">Storage</text>
  <text x="24" y="335" fill="#CCCCCC" font-size="14">Monitoring</text>

  <!-- Main Canvas Content Area -->
  <rect x="240" y="50" width="1040" height="750" fill="#0f1214"/>

  <!-- Breadcrumbs & Title Area -->
  <text x="270" y="90" fill="#8A8D90" font-size="13">Pipelines  ›  <tspan fill="#FFFFFF">oc-pipelines-oc-final</tspan></text>
  <text x="270" y="130" fill="#FFFFFF" font-size="24" font-weight="700">oc-pipelines-oc-final</text>

  <!-- Action Buttons -->
  <rect x="1100" y="105" width="135" height="32" rx="4" fill="#0066CC"/>
  <text x="1120" y="126" fill="#FFFFFF" font-size="13" font-weight="600">Start Pipeline</text>

  <!-- Navigation Tabs -->
  <line x1="270" y1="155" x2="1240" y2="155" stroke="#393f44" stroke-width="1"/>
  <text x="270" y="150" fill="#0066CC" font-size="14" font-weight="600">Details</text>
  <rect x="270" y="153" width="45" height="3" fill="#0066CC"/>
  <text x="340" y="150" fill="#8A8D90" font-size="14">YAML</text>
  <text x="400" y="150" fill="#8A8D90" font-size="14">PipelineRuns</text>
  <text x="510" y="150" fill="#8A8D90" font-size="14">Parameters</text>
  <text x="610" y="150" fill="#8A8D90" font-size="14">Workspaces</text>

  <!-- Pipeline Graph DAG Layout Container -->
  <rect x="270" y="175" width="970" height="230" rx="4" fill="#1b1d21" stroke="#2b2d30" stroke-width="1"/>
  <text x="290" y="202" fill="#FFFFFF" font-size="15" font-weight="600">Pipeline Task Workflow DAG</text>
  <line x1="290" y1="215" x2="1220" y2="215" stroke="#393f44" stroke-width="1"/>

  <!-- Task 1 Node: fetch-repository -->
  <rect x="290" y="250" width="130" height="55" rx="5" fill="#24272b" stroke="#0066CC" stroke-width="2"/>
  <text x="305" y="275" fill="#FFFFFF" font-size="12" font-weight="600">fetch-repository</text>
  <text x="305" y="292" fill="#8A8D90" font-size="10">ClusterTask/git-clone</text>

  <!-- Connector Line 1 -->
  <line x1="420" y1="277" x2="445" y2="277" stroke="#0066CC" stroke-width="2"/>
  <polygon points="445,273 452,277 445,281" fill="#0066CC"/>

  <!-- Task 2 Node: cleanup -->
  <rect x="455" y="250" width="115" height="55" rx="5" fill="#24272b" stroke="#0066CC" stroke-width="2"/>
  <text x="470" y="275" fill="#FFFFFF" font-size="12" font-weight="600">cleanup</text>
  <text x="470" y="292" fill="#8A8D90" font-size="10">Task/cleanup</text>

  <!-- Connector Line 2 -->
  <line x1="570" y1="277" x2="595" y2="277" stroke="#0066CC" stroke-width="2"/>
  <polygon points="595,273 602,277 595,281" fill="#0066CC"/>

  <!-- Task 3 Node: lint -->
  <rect x="605" y="250" width="115" height="55" rx="5" fill="#24272b" stroke="#0066CC" stroke-width="2"/>
  <text x="620" y="275" fill="#FFFFFF" font-size="12" font-weight="600">lint</text>
  <text x="620" y="292" fill="#8A8D90" font-size="10">Task/flake8</text>

  <!-- Connector Line 3 -->
  <line x1="720" y1="277" x2="745" y2="277" stroke="#0066CC" stroke-width="2"/>
  <polygon points="745,273 752,277 745,281" fill="#0066CC"/>

  <!-- Task 4 Node: test -->
  <rect x="755" y="250" width="115" height="55" rx="5" fill="#24272b" stroke="#0066CC" stroke-width="2"/>
  <text x="770" y="275" fill="#FFFFFF" font-size="12" font-weight="600">test</text>
  <text x="770" y="292" fill="#8A8D90" font-size="10">Task/nosetests</text>

  <!-- Connector Line 4 -->
  <line x1="870" y1="277" x2="895" y2="277" stroke="#0066CC" stroke-width="2"/>
  <polygon points="895,273 902,277 895,281" fill="#0066CC"/>

  <!-- Task 5 Node: build-image -->
  <rect x="905" y="250" width="125" height="55" rx="5" fill="#24272b" stroke="#0066CC" stroke-width="2"/>
  <text x="918" y="275" fill="#FFFFFF" font-size="12" font-weight="600">build-image</text>
  <text x="918" y="292" fill="#8A8D90" font-size="10">ClusterTask/buildah</text>

  <!-- Connector Line 5 -->
  <line x1="1030" y1="277" x2="1055" y2="277" stroke="#0066CC" stroke-width="2"/>
  <polygon points="1055,273 1062,277 1055,281" fill="#0066CC"/>

  <!-- Task 6 Node: deploy -->
  <rect x="1065" y="250" width="115" height="55" rx="5" fill="#24272b" stroke="#0066CC" stroke-width="2"/>
  <text x="1080" y="275" fill="#FFFFFF" font-size="12" font-weight="600">deploy</text>
  <text x="1080" y="292" fill="#8A8D90" font-size="10">ClusterTask/openshift</text>

  <!-- Pipeline Details Information Grid -->
  <rect x="270" y="425" width="970" height="335" rx="4" fill="#1b1d21" stroke="#2b2d30" stroke-width="1"/>
  <text x="300" y="455" fill="#FFFFFF" font-size="16" font-weight="600">Pipeline Overview & Configuration</text>
  <line x1="300" y1="468" x2="1210" y2="468" stroke="#393f44" stroke-width="1"/>

  <!-- Column 1 -->
  <text x="300" y="500" fill="#8A8D90" font-size="13">Name</text>
  <text x="300" y="522" fill="#FFFFFF" font-size="14" font-weight="600">oc-pipelines-oc-final</text>

  <text x="300" y="555" fill="#8A8D90" font-size="13">Namespace</text>
  <text x="300" y="577" fill="#0066CC" font-size="14">sn-labs-rushiketh07</text>

  <text x="300" y="610" fill="#8A8D90" font-size="13">Labels</text>
  <rect x="300" y="622" width="180" height="24" rx="3" fill="#2b2d30"/>
  <text x="308" y="638" fill="#CCCCCC" font-size="12">app.kubernetes.io/part-of=accounts</text>

  <!-- Column 2 -->
  <text x="650" y="500" fill="#8A8D90" font-size="13">Workspaces</text>
  <text x="650" y="522" fill="#FFFFFF" font-size="14">pipeline-workspace (Bound to PersistentVolumeClaim)</text>

  <text x="650" y="555" fill="#8A8D90" font-size="13">Parameters</text>
  <text x="650" y="577" fill="#FFFFFF" font-size="13">git-url: https://github.com/rushiketh07/ci-cd-final-project.git</text>
  <text x="650" y="597" fill="#FFFFFF" font-size="13">git-revision: main</text>
  <text x="650" y="617" fill="#FFFFFF" font-size="13">image-name: image-registry.../accounts:latest</text>

  <text x="650" y="655" fill="#8A8D90" font-size="13">Tasks Count</text>
  <text x="650" y="677" fill="#FFFFFF" font-size="14">6 sequential tasks (0 condition checks)</text>
</svg>

